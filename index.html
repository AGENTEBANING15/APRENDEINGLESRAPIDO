<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inglés en 90 días</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbf7f0;--card:#fff;--ink:#1f2421;--mut:#6b6f6a;--line:#e8e1d4;--verde:#0f7b4f;--rojo:#c8372d;--oro:#d99a1e;--b:#185FA5;--az:#185FA5;--i:#d99a1e;--a:#c8372d}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{background:linear-gradient(90deg,#185FA5 0 33.3%,#fff 33.3% 66.6%,var(--rojo) 66.6%);height:6px}
.wrap{max-width:960px;margin:0 auto;padding:20px 16px 60px}
h1{font-family:Fraunces,serif;font-size:2rem;margin:10px 0 4px}
h2{font-family:Fraunces,serif;margin:0 0 6px}
.sub{color:var(--mut);margin:0 0 16px}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--verde);transition:.4s}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card);padding:9px 14px;border-radius:10px;cursor:pointer;font:inherit;font-weight:500}
.btn:hover{border-color:var(--ink)}
.btn.p{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.g{background:var(--verde);color:#fff;border-color:var(--verde)}
.btn.sm{padding:5px 9px;font-size:.85rem}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}
.tab{padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);cursor:pointer;font:inherit}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.lvl{margin:22px 0 8px;display:flex;align-items:center;gap:8px;font-weight:600}
.dot{width:12px;height:12px;border-radius:50%}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.day{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;position:relative;border-top:4px solid var(--c)}
.day:hover{transform:translateY(-2px);box-shadow:0 4px 14px #0001}
.day b{font-family:Fraunces,serif;font-size:1.3rem}
.day small{display:block;color:var(--mut);margin-top:3px}
.day .ok{position:absolute;top:8px;right:10px;color:var(--verde);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin:12px 0}
.vocab{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.w{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.w .it{font-weight:600}.w .es{color:var(--mut);font-size:.88rem}
.spk{border:none;background:#f1ece2;border-radius:8px;cursor:pointer;padding:6px 8px;font-size:1rem}
.spk:hover{background:#e6dfd0}
.note{background:#fff8e6;border-left:4px solid var(--oro);padding:10px 12px;border-radius:8px;font-size:.95rem}
table{width:100%;border-collapse:collapse}
td{padding:8px;border-bottom:1px solid var(--line)}
td:first-child{color:var(--mut);width:110px}
.big{font-family:Fraunces,serif;font-size:2.2rem;text-align:center;margin:14px 0}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--card);cursor:pointer;font:inherit;text-align:left}
.opt.ok{background:#e3f4ea;border-color:var(--verde)}.opt.bad{background:#fbe5e2;border-color:var(--rojo)}
input[type=text]{width:100%;padding:12px;font:inherit;font-size:1.1rem;border:1px solid var(--line);border-radius:10px}
.fb{margin-top:10px;font-weight:500;min-height:1.4em}
.fb.ok{color:var(--verde)}.fb.bad{color:var(--rojo)}
.mut{color:var(--mut)}
.score{font-weight:600}
.acc{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.acc button{width:36px}
input[type=password]{width:100%;padding:12px;font:inherit;font-size:1.1rem;border:1px solid var(--line);border-radius:10px}
.pr{font-family:ui-monospace,Menlo,monospace;font-size:.78rem;color:var(--az);font-weight:400}
details.w summary::-webkit-details-marker{color:var(--mut)}
.eyebrow{font-size:.78rem;text-transform:uppercase;letter-spacing:.1em;color:var(--az);font-weight:600;margin:16px 0 0}
.jump{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0;margin:10px 0 0}
.blk{margin-top:30px;scroll-margin-top:60px}
.blk>div,.blk{scroll-margin-top:60px}
.sec{font-family:Fraunces,serif;font-weight:600;font-size:1.4rem;margin:0 0 8px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.sec i{color:var(--az)}.how{margin-top:10px;display:grid;gap:8px}.hw{border:1.5px solid #b9d3ee;background:#eef5fc;border-radius:12px;padding:10px 12px;text-align:left;line-height:1.5}
.sec small{font-family:Inter,sans-serif;font-style:normal;font-size:.7rem;text-transform:uppercase;letter-spacing:.09em;color:var(--mut);margin-left:6px}
.prose{line-height:1.65;max-width:70ch}.prose p{margin:0 0 10px}
.tblgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:0 14px}
.cap{text-align:left;padding:10px 12px 4px;font-size:.74rem;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);font-weight:600}
.th{text-align:left;padding:8px;color:var(--mut);font-size:.8rem;font-weight:600}
.notes{line-height:1.6;max-width:70ch;padding-left:20px}.notes li{margin:4px 0}
.fab{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:50px;height:50px;border-radius:50%;border:none;background:var(--ink);color:#fff;font-size:1.3rem;cursor:pointer;z-index:20;box-shadow:0 3px 10px #0003}
.idx{position:fixed;right:16px;bottom:calc(78px + env(safe-area-inset-bottom,0px));width:200px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:6px;z-index:20;box-shadow:0 6px 20px #0002;display:flex;flex-direction:column}
.idx[hidden]{display:none}
.idx button{border:none;background:none;text-align:left;padding:9px 12px;border-radius:9px;font:inherit;font-size:.92rem;cursor:pointer;color:var(--ink)}
.idx button.on{background:#e3f4ea;color:var(--verde);font-weight:600}
.idx .up{border-top:1px solid var(--line);border-radius:0;color:var(--mut)}
.rule{border-radius:10px;padding:10px 12px;margin:8px 0}
.rule.v{background:#e3f4ea;color:#0f5c3b}.rule.a{background:#fff3d6;color:#7a5200}
.rule small{display:block;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.rule div{font-size:1rem;margin-top:3px}
.lbl{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);font-weight:600;margin:16px 0 6px}
.sndt{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.sr{display:grid;grid-template-columns:92px 1fr 44px;gap:6px;align-items:center;padding:8px 10px;border-top:1px solid var(--line)}
.sr.hd{background:#f1ece2;color:var(--mut);font-size:.8rem;border-top:none}
.clave{border-radius:10px;padding:10px 12px;margin:8px 0}
.clave small{display:block;font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;font-weight:600}
.clave div{margin-top:3px;line-height:1.5}.clave .cx{display:flex;align-items:center;gap:8px;font-style:italic;font-size:.92rem}
.clave.v{background:#e3f4ea;color:#0f5c3b}.clave.b{background:#e6eef9;color:#1d4a80}.clave.a{background:#fff3d6;color:#7a5200}
.hint{font-size:.85rem;color:var(--mut);margin:2px 0 10px}
.ej{display:inline-block;border:1px dashed #9a958a;border-radius:6px;padding:1px 9px;color:var(--ink);background:#faf8f3;font-style:normal}
body.typing .fab,body.typing .idx{display:none!important}
.tbar{height:8px;border-radius:4px;background:#fff;margin:10px 0 8px;overflow:hidden}.tbar i{display:block;height:100%;width:0;background:var(--verde)}
.ev{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.ev button{padding:10px 6px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer}
.ev .ok{background:#e3f4ea;color:#0f5c3b;border:1px solid #9fd3b6}.ev .mid{background:#fff3d6;color:#7a5200;border:1px solid #f0cf86}.ev .bad{background:#fbe5e2;color:#9b2a22;border:1px solid #f0b3ac}
.hard{display:inline-block;background:#fff3d6;color:#7a5200;border-radius:999px;padding:3px 12px;font-size:.8rem;font-weight:600;margin:6px 0 0}
.micb{width:100%;height:52px;border:none;border-radius:26px;background:var(--rojo);color:#fff;font:inherit;font-size:1.05rem;font-weight:600;cursor:pointer}
.micb.on{background:#7a1d16;animation:pul 1s infinite}@keyframes pul{50%{opacity:.7}}
.er{display:grid;grid-template-columns:28px 1fr 44px;gap:6px;align-items:center;padding:8px 10px;border-top:1px solid var(--line)}.er:first-child{border-top:none}
.er small.bad{color:var(--rojo)}
.chat{display:flex;flex-direction:column;gap:8px;margin:6px 0}
.bb{max-width:82%;padding:8px 12px;border-radius:14px;line-height:1.4}.bb small{display:block;font-size:.72rem;color:var(--mut);font-weight:600}
.bb.other{align-self:flex-start;background:#f1ece2;border-bottom-left-radius:4px}
.bb.me{align-self:flex-end;border-bottom-right-radius:4px}.bb.me.ok{background:#e3f4ea;color:#0f5c3b}.bb.me.bad{background:#fbe5e2;color:#9b2a22}
.bb.turn{margin:6px 0 10px auto;border:1.5px dashed var(--verde);color:#0f5c3b;max-width:90%}
.micb{transition:background .2s}.micb.on{background:#a32d2d!important;animation:pr 1.2s infinite}
@keyframes pr{0%{box-shadow:0 0 0 0 rgba(226,75,74,.55)}100%{box-shadow:0 0 0 14px rgba(226,75,74,0)}}
.micb.ok{background:var(--verde)!important}.micb.bad{background:#9b2a22!important}
.wv{display:inline-flex;align-items:center;height:24px;margin-right:6px;vertical-align:middle}.wv i{display:inline-block;width:4px;margin:0 2px;border-radius:2px;background:#fff;animation:wv .9s ease-in-out infinite}
.wv i:nth-child(2){animation-delay:.15s}.wv i:nth-child(3){animation-delay:.3s}.wv i:nth-child(4){animation-delay:.45s}@keyframes wv{0%,100%{height:6px}50%{height:22px}}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;text-align:left}
.cbx{border-radius:12px;padding:8px 10px;line-height:1.45}.cbx small{display:flex;align-items:center;gap:6px;font-size:.72rem;font-weight:600;margin-bottom:2px}
.cbx.bad{background:#fbe5e2;color:#9b2a22}.cbx.bad u{text-decoration-thickness:2px;font-weight:600}
.cbx.ok{background:#e3f4ea;color:#0f5c3b}.cbx.ok b{text-decoration:underline;text-decoration-thickness:2px}
.cbx .spk{padding:2px 5px;font-size:.85rem}
.rd{font-size:1.35rem;font-weight:600;color:var(--ink);margin:4px 0}
.day.locked{opacity:.55;background:#f4f1ea}
.modal{position:fixed;inset:0;background:#0006;display:flex;align-items:center;justify-content:center;z-index:9}
.modal .card{max-width:400px;text-align:center}
@media(max-width:560px){.opts{grid-template-columns:1fr}h1{font-size:1.6rem}}
</style>
</head>

    <div class="w" style="margin:6px 0 12px 40px;background:#f3f8f5"><div class="it">B: ${line}</div></div><p class="mut">${x.es}</p>
    <div class="opts">${x.opts.map(o=>`<button class="opt" data-r="${o===x.w?1:0}" onclick="ansF(this)">${o}</button>`).join("")}</div><div class="fb" id="ffb"></div></div>`}
  else if(x.t==="verb"){const ans=x.v[3][x.i],pref=ans.match(/^(che \w+|se \w+)\s/);window.__vt=pref?ans.slice(pref[0].length):ans;
    pane().innerHTML=`<div class="card">${hd}<h2>Verbo del día</h2><p style="margin-bottom:4px">Conjuga <b>${x.v[0]}</b> (${x.v[2]}) para <b>${pref?pref[1]:P[x.i]}</b></p>${exVerb(x.v,x.i)}
    <input type="text" id="fin" autocomplete="off" onkeydown="if(event.key==='Enter')chkFT()">${accBar("fin")}<div class="row" style="margin-top:10px"><button class="btn p" id="fb2" onclick="chkFT()">Comprobar</button></div><div class="fb" id="ffb"></div></div>`}
  else if(x.t==="hard"){window.__vt=x.it;const ttl={dict:"Dictado: escribe la frase completa",trad:"Traduce la frase completa",resp:"Responde en el diálogo"}[x.m];
    const body=x.m==="dict"?`<p class="hint">Ejemplo: si oyes <i>Hi! How are you?</i>, escribes <span class="ej">Hi! How are you?</span></p><div style="text-align:center;margin:12px 0"><button class="btn p" onclick="say('${esc(x.it)}')">🔊 Escuchar</button> <button class="btn" onclick="say('${esc(x.it)}',1)">🐢 Lento</button></div>`
     :x.m==="trad"?`<p class="hint">Ejemplo: <i>Estoy bien, gracias.</i> → escribes <span class="ej">I'm fine, thanks.</span></p><div class="big" style="font-size:1.5rem">${x.es}</div>`
     :`<p class="hint">Ejemplo: A dice «How are you?» y te piden «Bien, ¿y tú?» → escribes <span class="ej">Fine, and you?</span></p><div class="w" style="margin:6px 40px 6px 0"><div><div class="mut" style="font-size:.75rem">A dice</div><div class="it">${x.prev}</div></div>${spk(x.prev)}</div><p>Tú (B) quieres decir: <b>«${x.es}»</b></p>`;
    pane().innerHTML=`<div class="card">${hd}<h2>${ttl}</h2>${body}
    <input type="text" id="fin" autocomplete="off" placeholder="Escribe en inglés…" onkeydown="if(event.key==='Enter')chkFT()">${accBar("fin")}<div class="row" style="margin-top:10px"><button class="btn p" id="fb2" onclick="chkFT()">Comprobar</button></div><div class="fb" id="ffb"></div></div>`;
    if(x.m==="dict")setTimeout(()=>say(x.it),300)}
  else{window.__vt=x.it;pane().innerHTML=`<div class="card">${hd}<h2>Traduce al inglés</h2>${(o=>`<p class="hint">Ejemplo: <i>${o[1]}</i> → escribes <span class="ej">${o[0]}</span></p>`)(otherW(x.it))}<div class="big">${x.es}</div>
    <input type="text" id="fin" autocomplete="off" onkeydown="if(event.key==='Enter')chkFT()">${accBar("fin")}<div class="row" style="margin-top:10px"><button class="btn p" id="fb2" onclick="chkFT()">Comprobar</button></div><div class="fb" id="ffb"></div></div>`}
}
function drawOrd(){if(window.__lock)return;document.getElementById("built").innerHTML=window.__built.map((w,i)=>`<button class="btn sm" onclick="window.__pool.push(window.__built.splice(${i},1)[0]);drawOrd()">${w}</button>`).join("");
  document.getElementById("pool").innerHTML=window.__pool.map((w,i)=>`<button class="btn sm" onclick="window.__built.push(window.__pool.splice(${i},1)[0]);drawOrd()">${w}</button>`).join("")}
function fNext(ok,msg,it){const fb=document.getElementById("ffb");if(ok)q.ok++;fb.className="fb "+(ok?"ok":"bad");fb.textContent=msg;say(it);q.k++;
  const b=document.getElementById("fb2");if(b){b.textContent="Siguiente →";b.onclick=nextF}else setTimeout(nextF,1800)}
function chkOrd(){const x=q.items[q.k],ok=norm(window.__built.join(" "))===norm(x.it);window.__lock=true;const pl=document.getElementById("pool");if(pl)pl.innerHTML="";fNext(ok,(ok?"✓ Perfect! ":"✗ Correcto: ")+x.it,x.it)}
function ansF(b){const x=q.items[q.k];document.querySelectorAll(".opt").forEach(o=>{o.disabled=true;if(o.dataset.r==="1")o.classList.add("ok")});if(b.dataset.r!=="1")b.classList.add("bad");
  fNext(b.dataset.r==="1",(b.dataset.r==="1"?"✓ ":"✗ ")+x.it,x.it)}
function chkFT(){const g=document.getElementById("fin").value,t=window.__vt,alts=[t,t.replace(/\/[ae]$/,""),t.replace(/([oi])\/([ae])$/,"$2")];
  const ok=alts.some(a=>norm(a)===norm(g));fNext(ok,(ok?"✓ Correct! ":"✗ Correcto: ")+t,t.replace(/\/[ae]$/,""))}

// ---------- sesión ----------
const LS={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},del:k=>{try{localStorage.removeItem(k)}catch(e){}}};
const save=()=>{if(USER)LS.set("en90_"+USER.u,JSON.stringify(done))};
const srv=(fn,...a)=>GAS?new Promise((res,rej)=>google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](...a))
  :fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({fn,args:a})}).then(r=>r.json()).then(r=>{if(r&&r.error)throw new Error(r.error);return r.data});
function showLogin(msg){
  view="login";
  app.innerHTML=`<div style="display:flex;justify-content:center;padding:30px 0"><div class="card" style="width:100%;max-width:360px;padding:0;overflow:hidden">
  <div style="height:6px;background:linear-gradient(90deg,#185FA5 0 33.3%,#fff 33.3% 66.6%,var(--rojo) 66.6%)"></div>
  <form style="padding:24px" onsubmit="event.preventDefault();doLogin()">
   <div style="text-align:center;margin-bottom:18px"><div style="width:56px;height:56px;border-radius:50%;background:#e3f4ea;display:inline-flex;align-items:center;justify-content:center;font-size:28px">📘</div>
   <h2 style="margin:8px 0 2px">Inglés en 90 días</h2><p class="mut" style="margin:0">Welcome! Ingresa para ver tu avance</p></div>
   <label class="mut">Usuario</label><input type="text" id="lu" autocomplete="username" style="margin:4px 0 12px">
   <label class="mut">Contraseña</label><div style="position:relative"><input type="password" id="lp" autocomplete="current-password" style="margin:4px 0 8px;padding-right:44px">
   <button type="button" class="spk" style="position:absolute;right:6px;top:12px" onclick="const p=document.getElementById('lp');p.type=p.type==='password'?'text':'password'">👁️</button></div>
   <label class="mut row" style="gap:6px;margin-bottom:14px"><input type="checkbox" id="lr" checked> Recordarme en este equipo</label>
   <button class="btn p" id="lb" style="width:100%;padding:12px">Ingresar</button>
   <div class="fb bad" id="lm" style="text-align:center">${msg||""}</div>
   <p class="mut" style="text-align:center;font-size:.85rem;border-top:1px solid var(--line);padding-top:12px;margin-bottom:0">${GS?"¿Olvidaste tu contraseña? Pídela al administrador.":"Modo sin conexión: escribe cualquier usuario; el avance se guarda en este equipo."}</p>
  </form></div></div>`;
  setTimeout(()=>document.getElementById("lu").focus(),50);
}
async function doLogin(){
  const u=document.getElementById("lu").value.trim(),p=document.getElementById("lp").value,r=document.getElementById("lr").checked,m=document.getElementById("lm"),b=document.getElementById("lb");
  if(!u||(GS&&!p)){m.textContent="Escribe tu usuario y contraseña.";return}
  if(!GS){if(r)LS.set("en90user",u);entrar({u,nombre:u,avance:null},null);return}
  b.textContent="Verificando…";b.disabled=true;
  try{const x=await srv("login",u,p);
    if(x&&x.ok){if(r)LS.set("en90tk",x.token);entrar(x,x.token)}else{m.textContent=x.msg||"Usuario o contraseña incorrectos";b.textContent="Ingresar";b.disabled=false}}
  catch(e){m.textContent="No hay conexión con el servidor. Intenta otra vez.";b.textContent="Ingresar";b.disabled=false}
}
function entrar(r,tk){USER={u:r.u,n:r.nombre};MAXD=GS?Math.max(1,Math.min(90,Number(r.maxDia)||1)):90;errLoad();TOKEN=tk;let loc={};try{loc=JSON.parse(LS.get("en90_"+r.u)||"{}")}catch(e){}done=r.avance||loc;save();home()}
function logout(){if(GS&&TOKEN)srv("logout",TOKEN).catch(()=>{});LS.del("en90tk");LS.del("en90user");USER=null;TOKEN=null;done={};showLogin()}
async function start(){
  const tk=LS.get("en90tk");
  if(GS&&tk){app.innerHTML=`<p class="mut" style="text-align:center;padding:60px">Cargando…</p>`;try{const r=await srv("sesion",tk);if(r&&r.ok){entrar(r,tk);return}}catch(e){}LS.del("en90tk")}
  if(!GS){const u=LS.get("en90user");if(u){entrar({u,nombre:u,avance:null},null);return}}
  showLogin();
}
function registrar(pct){
  if(pct>=70&&(!done[cur]||pct>done[cur]))done[cur]=pct;save();
  if(GS&&TOKEN)srv("guardarDia",TOKEN,cur+1,D[cur].t,q.ok,q.items.length).then(r=>{if(r&&r.ok&&r.avance){done=r.avance;save()}else if(r&&r.msg==="sesion"){toast("Tu sesión expiró. Ingresa de nuevo.");logout()}else if(r&&r.msg==="bloqueado"){toast("Este día no está habilitado. Comunícate con el administrador.")}}).catch(()=>toast("No se pudo guardar en el servidor. Revisa tu conexión."));
}

// ---------- tips y trucos ----------
const TIPS=[

["<b>TH</b> tiene dos sonidos: sin voz en <i>think, three</i> (como la z de España) y con voz en <i>this, mother</i>. La lengua siempre asoma entre los dientes.","think, three, this, mother"],
["<b>Vocal corta vs larga</b> cambia el sentido: <i>ship</i> (barco) ≠ <i>sheep</i> (oveja), <i>live</i> ≠ <i>leave</i>, <i>full</i> ≠ <i>fool</i>.","ship, sheep. live, leave. full, fool"],

["En inglés americano la <b>T entre vocales</b> suena como una r suave: <i>water</i> [uárer], <i>better</i> [bérer].","water, better, city"],

{t:"⚠️ Falsos amigos (¡cuidado!)",i:[
["<b>actually</b> = en realidad (no «actualmente» → currently)","actually, currently"],["<b>assist</b> = ayudar (asistir a clase → attend)","assist, attend"],["<b>carpet</b> = alfombra (carpeta → folder)","carpet, folder"],["<b>embarrassed</b> = avergonzado (embarazada → pregnant)","embarrassed, pregnant"],["<b>library</b> = biblioteca (librería → bookstore)","library, bookstore"],["<b>sensible</b> = sensato (sensible → sensitive)","sensible, sensitive"],["<b>exit</b> = salida (éxito → success)","exit, success"],["<b>realize</b> = darse cuenta (realizar → carry out)","realize"],["<b>career</b> = trayectoria profesional (carrera universitaria → major)","career, major"],["<b>pretend</b> = fingir (pretender → intend)","pretend, intend"]]},
{t:"❌ Errores típicos de hispanohablantes",i:[
["✗ I have 30 years → ✓ <b>I am 30 years old</b>.","I am 30 years old"],
["✗ She work here → ✓ <b>She works here</b>: no olvides la -s con he/she/it.","She works here"],
["✗ Is raining → ✓ <b>It is raining</b>: en inglés siempre hay sujeto.","It is raining"],
["✗ The people is → ✓ <b>The people are</b>.","The people are nice"],
["✗ I am agree → ✓ <b>I agree</b>.","I agree"],
["✗ make homework → ✓ <b>do homework</b>. <i>Make</i> = fabricar/crear; <i>do</i> = tareas y actividades.","do homework, make a cake"],
["✗ in Monday → ✓ <b>on Monday</b> · ✗ in the night → ✓ <b>at night</b>.","on Monday, at night"],
["<b>home ≠ house</b>: <i>go home</i> (sin to) · <i>a big house</i>.","I go home"]]},
{t:"💬 Expresiones para sonar natural",i:[
["<b>How's it going?</b> = ¿qué tal?","How's it going?"],["<b>No worries!</b> = ¡no te preocupes! / de nada","No worries!"],["<b>Sounds good!</b> = ¡me parece bien!","Sounds good!"],["<b>I'm good</b> = estoy bien (muy americano)","I'm good, thanks"],["<b>Got it</b> = entendido","Got it"],["<b>Hang on</b> = espera un momento","Hang on a second"],["<b>Take care!</b> = ¡cuídate!","Take care!"],["<b>You're welcome</b> = de nada","You're welcome"]]},
{t:"🇺🇸 Cultura que nadie te cuenta",i:[
["«How are you?» muchas veces es solo un saludo: responde corto, <b>Good, thanks! And you?</b>","Good, thanks! And you?"],

function tips(){view="tips";
  app.innerHTML=`<button class="btn sm" onclick="home()">← Plan</button><h1>💡 Tips y trucos reales</h1><p class="sub">Lo que de verdad marca la diferencia al aprender inglés siendo hispanohablante.</p>
  ${TIPS.map(s=>`<div class="card"><h2>${s.t}</h2>${s.i.map(([tx,au])=>`<div class="w" style="margin:6px 0;align-items:flex-start"><div style="line-height:1.55">${tx}</div>${au?`<span>${spk(au)}</span>`:""}</div>`).join("")}</div>`).join("")}`;scrollTo(0,0)}

// ---------- repaso ----------
function repaso(){view="repaso";
  const dias=Object.keys(done).map(Number);const src=dias.length?dias:[...Array(nextDay()+1).keys()];
  const pool=shuf(src.flatMap(i=>D[i].w.concat(D[i].f.slice(0,2)))).slice(0,15);
  q={items:pool,k:0,ok:0,again:[]};nextR();
}
function nextR(){
  if(q.k>=q.items.length&&q.again.length){q.items=q.items.concat(q.again);q.again=[]}
  if(q.k>=q.items.length){app.innerHTML=`<button class="btn sm" onclick="home()">← Plan</button><div class="card" style="text-align:center"><h2>🧠 Repaso terminado</h2><p>Recordaste ${q.ok} tarjetas a la primera.</p><button class="btn p" onclick="repaso()">Otro repaso</button></div>`;return}
  const x=q.items[q.k];
  app.innerHTML=`<button class="btn sm" onclick="home()">← Plan</button><h1>🧠 Repaso rápido</h1><p class="sub">Tarjetas de los días que ya aprobaste. Tarjeta ${q.k+1}/${q.items.length}</p>
  <div class="card" style="text-align:center;min-height:240px"><div class="big">${x[0]}</div><div>${spk(x[0])} ${spkS(x[0])}</div>
  <div style="margin-top:16px"><button class="btn p" id="vb" onclick="this.style.display='none';document.getElementById('back').style.display='block'">Ver significado</button>
  <div id="back" style="display:none"><p style="font-size:1.3rem">${x[1]}</p><div class="row" style="justify-content:center"><button class="btn" onclick="q.again.push(q.items[q.k]);q.k++;nextR()">🔁 Repasar otra vez</button><button class="btn g" onclick="q.ok++;q.k++;nextR()">✓ Lo sabía</button></div></div></div></div>`;
  setTimeout(()=>say(x[0]),200);
}

document.addEventListener("focusin",e=>{if(e.target.matches&&e.target.matches('input[type=text]')){document.body.classList.add("typing");const c=e.target.closest(".card")||e.target.parentElement;setTimeout(()=>{if(c&&c.scrollIntoView)c.scrollIntoView({block:"start",behavior:"smooth"})},380)}});
document.addEventListener("focusout",e=>{if(e.target.matches&&e.target.matches('input[type=text]'))setTimeout(()=>{if(!(document.activeElement&&document.activeElement.matches&&document.activeElement.matches('input[type=text]')))document.body.classList.remove("typing")},150)});
let LEAVING=false;
function exitAsk(){if(document.querySelector(".modal.exit"))return;const d=document.createElement("div");d.className="modal exit";
  d.innerHTML=`<div class="card" style="text-align:center"><div style="font-size:2rem">🚪</div><h2 style="margin:6px 0">¿Deseas salir del aplicativo?</h2><p class="mut">Tu avance aprobado ya está guardado.</p><div class="row" style="justify-content:center"><button class="btn" onclick="this.closest('.modal').remove()">No, quedarme</button><button class="btn p" onclick="exitYes()">Sí, salir</button></div></div>`;document.body.append(d)}
function exitYes(){LEAVING=true;document.querySelectorAll(".modal.exit").forEach(m=>m.remove());history.back();setTimeout(()=>{if(document.visibilityState==="visible"){LEAVING=false;try{history.pushState({it:1},"")}catch(e){}toast("Ya puedes cerrar esta pestaña.")}},700)}
try{history.pushState({it:1},"")}catch(e){}
window.addEventListener("popstate",()=>{if(LEAVING)return;try{history.pushState({it:1},"")}catch(e){}
  document.querySelectorAll(".modal:not(.exit)").forEach(m=>m.remove());
  if(view==="day"||view==="tips"||view==="repaso"||view==="verbs"){try{speechSynthesis.cancel()}catch(e){}home()}else exitAsk()});
window.addEventListener("beforeunload",e=>{if(USER&&!LEAVING){e.preventDefault();e.returnValue=""}});
start();
